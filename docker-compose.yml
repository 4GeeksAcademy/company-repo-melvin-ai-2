# Brasaland local development. Secrets come from root .env only.
# Inside this network the API host is the service name `backend`, not localhost.

networks:
  brasaland:
    name: brasaland-dev

volumes:
  ui_website_node_modules:
  ui_backoffice_node_modules:
  ui_website_next:
  ui_backoffice_next:

services:
  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    networks:
      brasaland:

  backend:
    build:
      context: ./services
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /workspace:/workspace/services:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/api:/app
      - .:/workspace
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      brasaland:

  worker:
    build:
      context: ./services
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /workspace:/workspace/services/api
    working_dir: /workspace
    command: celery -A services.celery_app worker --loglevel=info
    volumes:
      - .:/workspace
    depends_on:
      redis:
        condition: service_started
    networks:
      brasaland:

  flower:
    build:
      context: ./services
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /workspace:/workspace/services/api
    working_dir: /workspace
    command: celery -A services.celery_app flower --port=5555 --address=0.0.0.0
    ports:
      - "5555:5555"
    volumes:
      - .:/workspace
    depends_on:
      redis:
        condition: service_started
    networks:
      brasaland:

  ui:
    build:
      context: .
      dockerfile: uis/Dockerfile
    env_file:
      - .env
    volumes:
      - ./uis/website:/workspace/uis/website
      - ./uis/backoffice:/workspace/uis/backoffice
      - ./packages/auth:/workspace/packages/auth
      - ./src:/workspace/src
      - ./uis/start.sh:/workspace/uis/start.sh
      - ui_website_node_modules:/workspace/uis/website/node_modules
      - ui_backoffice_node_modules:/workspace/uis/backoffice/node_modules
      - ui_website_next:/workspace/uis/website/.next
      - ui_backoffice_next:/workspace/uis/backoffice/.next
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      brasaland:
