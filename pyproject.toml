# Thin test runner so `uv run pytest` works at the git root (AUTH-088).
# The FastAPI app itself stays a standalone project under services/api.
# This file does not replace root package.json (Node) or the API uv project.

[project]
name = "brasaland"
version = "0.0.1"
description = "Brasaland monorepo auth test runner"
requires-python = ">=3.12"
dependencies = [
  "brasaland-api",
  "fastmcp>=4.1.6",
  "langchain-mcp-adapters>=0.3.1",
  "langgraph>=1.2.19",
  "matplotlib>=3.11.2",
  "mcpauth>=0.1.1",
  "pandas>=3.0.6",
  "qdrant-client>=1.20.0",
  "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
brasaland-api = { path = "services/api", editable = true }

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "tests/pipelines/test_sales_forecast_split.py", "tests/pipelines/test_sales_forecast_cv.py", "tests/pipelines/test_rag.py", "tests/pipelines/test_agent_graph.py", "tests/pipelines/test_agent_tools.py", "tests/pipelines/test_mcp_server.py", "tests/pipelines/test_agent_memory.py"]
pythonpath = ["services/api"]

[tool.coverage.run]
source_pkgs = ["app.auth"]
omit = ["*/app/auth/__init__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true
