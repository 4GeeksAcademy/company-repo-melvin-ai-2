[project]
name = "brasaland-api"
version = "0.2.0"
description = "Brasaland internal FastAPI services"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "tinydb>=4.8.0",
  "pydantic>=2.7.0",
  "cryptography==43.0.3",
  "python-jose[cryptography]>=3.5.0",
  "libpass[bcrypt]>=1.9.3",
  "python-dotenv>=1.2.1",
  "resend>=2.42.0",
]

[project.scripts]
seed = "seed:seed_command"
seed-auth = "app.auth.seed:seed_command"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app/auth"]
omit = ["app/auth/__init__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "routes"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"models.py" = "models.py"
"database.py" = "database.py"
"seed.py" = "seed.py"
