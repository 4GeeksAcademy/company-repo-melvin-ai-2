[project]
name = "brasaland-api"
version = "0.2.0"
description = "Brasaland internal FastAPI services"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "tinydb>=4.8.0",
  "pydantic>=2.7.0",
]

[project.scripts]
seed = "seed:seed_command"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "routes"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"models.py" = "models.py"
"database.py" = "database.py"
"seed.py" = "seed.py"
